org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false

# Project on E: + default Pub cache on C: — Kotlin IC cannot relativize across drives (Windows).
kotlin.incremental=false

# JDK for Gradle (matches Flutter jdk-dir / Android Studio JBR)
org.gradle.java.home=D:/Utils/Android/Android Studio/jbr

# Reduce flaky DNS / slow HTTPS to repo.maven.apache.org (Windows)
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
